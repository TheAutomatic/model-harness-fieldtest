<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#eaf6fc;display:flex;align-items:center;justify-content:center;min-height:100vh}
  svg{width:min(96vw,1000px);height:auto;display:block;border-radius:18px;box-shadow:0 12px 40px rgba(20,40,60,.18)}
  .clouds{animation:drift 60s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-900px)}}
  .dash{animation:road 2.24s linear infinite}
  @keyframes road{from{stroke-dashoffset:0}to{stroke-dashoffset:760}}
  .chain{animation:chain .8s linear infinite}
  @keyframes chain{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只卡通鹈鹕在乡间路上骑自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ddf5"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
  </defs>

  <!-- 天空 / 太阳 -->
  <rect width="900" height="560" fill="url(#sky)"/>
  <circle cx="795" cy="84" r="54" fill="#ffd35c" opacity=".25"/>
  <circle cx="795" cy="84" r="36" fill="#ffd35c"/>

  <!-- 云（两份错开 900 实现无缝循环） -->
  <g class="clouds" fill="#ffffff" opacity=".92">
    <g>
      <g transform="translate(170 86)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
      <g transform="translate(470 58) scale(.8)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
      <g transform="translate(700 145) scale(.62)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
    </g>
    <g>
      <g transform="translate(1070 86)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
      <g transform="translate(1370 58) scale(.8)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
      <g transform="translate(1600 145) scale(.62)"><ellipse rx="46" ry="18"/><ellipse cx="-32" cy="7" rx="27" ry="13"/><ellipse cx="32" cy="6" rx="30" ry="14"/></g>
    </g>
  </g>

  <!-- 远山 / 草地 -->
  <path d="M0,500 C150,448 320,458 470,484 C620,505 760,444 900,460 L900,500 Z" fill="#d3ebc6"/>
  <path d="M0,500 C130,428 250,436 370,470 C480,500 570,440 700,452 C790,460 850,478 900,468 L900,500 Z" fill="#b7dfa6"/>

  <!-- 公路 -->
  <rect x="0" y="500" width="900" height="60" fill="#686d74"/>
  <rect x="0" y="500" width="900" height="5" fill="#565b62"/>
  <line class="dash" x1="-80" y1="531" x2="980" y2="531" stroke="#f5d55a" stroke-width="6" stroke-dasharray="42 34"/>

  <!-- 车影 -->
  <ellipse cx="455" cy="506" rx="300" ry="9" fill="rgba(0,0,0,.12)"/>

  <!-- 远侧曲柄 + 踏板（在车架后面） -->
  <line id="crankF" x1="452" y1="432" x2="416" y2="432" stroke="#5a5d63" stroke-width="7" stroke-linecap="round"/>
  <g id="pedalF"><rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#3a3d42"/></g>

  <!-- 远侧腿 -->
  <line id="thighF" x1="455" y1="286" x2="496" y2="372" stroke="#d8873c" stroke-width="12" stroke-linecap="round"/>
  <line id="shinF" x1="496" y1="372" x2="416" y2="423" stroke="#d8873c" stroke-width="8" stroke-linecap="round"/>
  <g id="footF"><path d="M-15,-5 L16,2 L-9,8 Z" fill="#d8873c" stroke="#d8873c" stroke-width="5" stroke-linejoin="round"/></g>

  <!-- 后轮 -->
  <g>
    <circle cx="255" cy="415" r="82" fill="none" stroke="#2f3237" stroke-width="13"/>
    <circle cx="255" cy="415" r="71" fill="none" stroke="#cfd6de" stroke-width="5"/>
    <g id="spokesR" stroke="#9aa1ab" stroke-width="2.5">
      <line x1="189" y1="415" x2="321" y2="415"/>
      <line x1="197.8" y1="382" x2="312.2" y2="448"/>
      <line x1="222" y1="357.8" x2="288" y2="472.2"/>
      <line x1="255" y1="349" x2="255" y2="481"/>
      <line x1="222" y1="472.2" x2="288" y2="357.8"/>
      <line x1="197.8" y1="448" x2="312.2" y2="382"/>
    </g>
    <circle cx="255" cy="415" r="9" fill="#45484e"/>
    <circle cx="255" cy="415" r="11" fill="none" stroke="#6a6e75" stroke-width="4"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="655" cy="415" r="82" fill="none" stroke="#2f3237" stroke-width="13"/>
    <circle cx="655" cy="415" r="71" fill="none" stroke="#cfd6de" stroke-width="5"/>
    <g id="spokesF" stroke="#9aa1ab" stroke-width="2.5">
      <line x1="589" y1="415" x2="721" y2="415"/>
      <line x1="597.8" y1="382" x2="712.2" y2="448"/>
      <line x1="622" y1="357.8" x2="688" y2="472.2"/>
      <line x1="655" y1="349" x2="655" y2="481"/>
      <line x1="622" y1="472.2" x2="688" y2="357.8"/>
      <line x1="597.8" y1="448" x2="712.2" y2="382"/>
    </g>
    <circle cx="655" cy="415" r="9" fill="#45484e"/>
  </g>

  <!-- 车架 -->
  <g stroke="#d1495b" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M255,415 L452,432"/>                <!-- 后下叉 -->
    <path d="M255,415 L392,300"/>                <!-- 后上叉 -->
    <path d="M392,300 L452,432"/>                <!-- 座管 -->
    <path d="M452,432 L616,326"/>                <!-- 下管 -->
    <path d="M392,300 L612,318"/>                <!-- 上管 -->
    <path d="M606,296 L655,415"/>                <!-- 前叉 -->
  </g>
  <line x1="386" y1="268" x2="392" y2="300" stroke="#7a7f88" stroke-width="7" stroke-linecap="round"/>
  <path d="M318,270 Q352,258 408,264 L404,274 Q354,270 324,278 Z" fill="#3a3d42"/>
  <path d="M606,296 L598,274 Q590,264 572,272" fill="none" stroke="#3a3d42" stroke-width="7" stroke-linecap="round"/>
  <circle cx="570" cy="273" r="6" fill="#3a3d42"/>

  <!-- 链条 + 牙盘 -->
  <line class="chain" x1="255" y1="404" x2="452" y2="410" stroke="#3c3f45" stroke-width="5" stroke-dasharray="6 4"/>
  <line class="chain" x1="255" y1="426" x2="452" y2="454" stroke="#3c3f45" stroke-width="5" stroke-dasharray="6 4"/>
  <circle cx="452" cy="432" r="21" fill="none" stroke="#6a6e75" stroke-width="5"/>

  <!-- 鹈鹕 -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M336,196 L270,156 L346,214 Z" fill="#f4ecd8"/>
    <path d="M336,208 L262,178 L340,224 Z" fill="#efe6cf"/>
    <path d="M334,224 L256,222 L336,244 Z" fill="#e7dcc0"/>
    <!-- 身体 -->
    <ellipse cx="430" cy="235" rx="112" ry="72" fill="#f9f4e6" transform="rotate(12 430 235)"/>
    <!-- 翅膀（搭在车把上） -->
    <path id="wing" d="M446,196 L566,268 L452,244 Z" fill="#ece1c4" stroke="#ece1c4" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 脖子 -->
    <path d="M480,206 C528,208 544,178 549,136" stroke="#f9f4e6" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- 围巾 -->
    <path d="M536,150 Q506,158 478,146 Q462,140 446,152" stroke="#e05252" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M534,152 Q508,170 484,162" stroke="#c94444" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M534,146 Q552,156 570,146" stroke="#e05252" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- 头 + 冠羽 -->
    <circle cx="560" cy="112" r="30" fill="#f9f4e6"/>
    <path d="M544,88 Q534,76 524,78" stroke="#e6dcbd" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M552,84 Q546,72 538,70" stroke="#e6dcbd" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 眼睛 -->
    <circle cx="572" cy="104" r="7" fill="#ffffff"/>
    <circle cx="573.5" cy="104" r="3.8" fill="#2b2b2b"/>
    <circle cx="575" cy="102.5" r="1.3" fill="#ffffff"/>
    <!-- 大嘴 + 喉囊 -->
    <path d="M578,100 C640,102 702,116 738,138 Q745,146 734,146 C690,139 630,131 577,123 Z" fill="#f4a63a"/>
    <path d="M600,110 L706,127" stroke="#d8892b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M577,122 C612,124 664,138 730,146 C706,166 652,172 610,160 C592,154 580,140 575,126 Z" fill="#f2933f"/>
  </g>

  <!-- 近侧曲柄 + 踏板 -->
  <line id="crankN" x1="452" y1="432" x2="488" y2="432" stroke="#666a70" stroke-width="7" stroke-linecap="round"/>
  <g id="pedalN"><rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#3a3d42"/></g>

  <!-- 近侧腿 -->
  <line id="thighN" x1="466" y1="284" x2="539" y2="344" stroke="#f2a24a" stroke-width="13" stroke-linecap="round"/>
  <line id="shinN" x1="539" y1="344" x2="488" y2="423" stroke="#f2a24a" stroke-width="9" stroke-linecap="round"/>
  <g id="footN"><path d="M-15,-5 L16,2 L-9,8 Z" fill="#f2a24a" stroke="#f2a24a" stroke-width="5" stroke-linejoin="round"/></g>
</svg>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var sR = $('spokesR'), sF = $('spokesF'),
      cN = $('crankN'), cF = $('crankF'),
      pN = $('pedalN'), pF = $('pedalF'),
      tN = $('thighN'), kN = $('shinN'), fN = $('footN'),
      tF = $('thighF'), kF = $('shinF'), fF = $('footF'),
      P = $('pelican'), W = $('wing');

  var OX = 452, OY = 432, R = 36, L = 95;          // 曲柄中心/半径，腿骨长度
  var HIPN = { x: 466, y: 284 }, HIPF = { x: 455, y: 286 };

  // 两段等长腿的逆运动学：膝盖取朝前(+)的那个解
  function knee(hx, hy, fx, fy) {
    var dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy);
    if (d > 2 * L - 0.5) d = 2 * L - 0.5;
    if (d < 1) d = 1;
    var ux = dx / d, uy = dy / d, a = d / 2, h = Math.sqrt(Math.max(0, L * L - a * a));
    return { x: hx + dx / 2 + uy * h, y: hy + dy / 2 - ux * h };
  }

  function leg(thigh, shin, foot, hx, hy, px, py) {
    var fy = py - 9;                                 // 脚踝略高于踏板
    var k = knee(hx, hy, px, fy);
    thigh.setAttribute('x1', hx); thigh.setAttribute('y1', hy);
    thigh.setAttribute('x2', k.x); thigh.setAttribute('y2', k.y);
    shin.setAttribute('x1', k.x); shin.setAttribute('y1', k.y);
    shin.setAttribute('x2', px);  shin.setAttribute('y2', fy);
    foot.setAttribute('transform', 'translate(' + px + ' ' + fy + ')');
  }

  function render(t) {
    var wa = t * 240;                                // 车轮角速度(度/秒)
    sR.setAttribute('transform', 'rotate(' + wa + ' 255 415)');
    sF.setAttribute('transform', 'rotate(' + wa + ' 655 415)');

    var bob = Math.sin(t * 6.9) * 2.6;               // 身体上下起伏
    P.setAttribute('transform', 'translate(0 ' + bob + ')');
    W.setAttribute('transform', 'rotate(' + (Math.sin(t * 3.1) * 3) + ' 446 198)');

    var th = t * 130 * Math.PI / 180;                // 曲柄角速度(度/秒)
    var cfg = [
      [th,            cN, pN, tN, kN, fN, HIPN],
      [th + Math.PI,  cF, pF, tF, kF, fF, HIPF]
    ];
    for (var i = 0; i < 2; i++) {
      var a = cfg[i][0], px = OX + R * Math.cos(a), py = OY + R * Math.sin(a);
      cfg[i][1].setAttribute('x2', px); cfg[i][1].setAttribute('y2', py);
      cfg[i][2].setAttribute('transform', 'translate(' + px + ' ' + py + ')');
      leg(cfg[i][3], cfg[i][4], cfg[i][5], cfg[i][6].x, cfg[i][6].y + bob, px, py);
    }
  }

  var t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    render((now - t0) / 1000);
    requestAnimationFrame(frame);
  }

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    render(0.6);                                     // 静态姿势
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
