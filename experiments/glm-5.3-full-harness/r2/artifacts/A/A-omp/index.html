<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#cdeefb, #eef9ff);
    font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  svg { width: min(96vw, 980px); height: auto; display: block; }

  /* 云朵飘动 */
  .cloud  { animation: drift 48s linear infinite; }
  .cloud.c2 { animation-duration: 66s; animation-delay: -30s; }
  .cloud.c3 { animation-duration: 56s; animation-delay: -47s; }
  @keyframes drift { from { transform: translateX(-280px); } to { transform: translateX(1200px); } }

  /* 太阳光芒慢转 */
  .rays {
    transform-box: fill-box; transform-origin: center;
    animation: spin 42s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 身后速度线 */
  .gust { stroke: #ffffff; stroke-width: 6; stroke-linecap: round;
          stroke-dasharray: 70 60; opacity: .8;
          animation: gust 1.1s linear infinite; }
  .g2 { animation-delay: -.4s; }
  .g3 { animation-delay: -.8s; }
  @keyframes gust { to { stroke-dashoffset: -130; } }
</style>
</head>
<body>
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只卡通鹈鹕在骑自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcf5"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="620" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <g class="rays" stroke="#ffd54f" stroke-width="7" stroke-linecap="round">
      <line x1="790" y1="18"  x2="790" y2="42"/>
      <line x1="790" y1="138" x2="790" y2="162"/>
      <line x1="716" y1="90"  x2="740" y2="90"/>
      <line x1="840" y1="90"  x2="864" y2="90"/>
      <line x1="738" y1="38"  x2="755" y2="55"/>
      <line x1="825" y1="125" x2="842" y2="142"/>
      <line x1="842" y1="38"  x2="825" y2="55"/>
      <line x1="755" y1="125" x2="738" y2="142"/>
    </g>
    <circle cx="790" cy="90" r="40" fill="#ffd54f"/>
    <circle cx="790" cy="90" r="32" fill="#ffe082"/>
  </g>

  <!-- 云朵 -->
  <g class="cloud" fill="#ffffff" opacity="0.95">
    <ellipse cx="120" cy="110" rx="46" ry="20"/>
    <ellipse cx="160" cy="98"  rx="34" ry="17"/>
    <ellipse cx="85"  cy="100" rx="28" ry="14"/>
  </g>
  <g class="cloud c2" fill="#ffffff" opacity="0.85">
    <ellipse cx="320" cy="180" rx="40" ry="17"/>
    <ellipse cx="352" cy="170" rx="27" ry="13"/>
  </g>
  <g class="cloud c3" fill="#ffffff" opacity="0.9">
    <ellipse cx="540" cy="80" rx="50" ry="21"/>
    <ellipse cx="585" cy="68"  rx="33" ry="15"/>
    <ellipse cx="505" cy="70"  rx="26" ry="13"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="180" cy="560" rx="330" ry="130" fill="#b7dfb9"/>
  <ellipse cx="700" cy="570" rx="380" ry="150" fill="#a3d6a6"/>

  <!-- 速度线 -->
  <line class="gust"    x1="60"  y1="240" x2="200" y2="240"/>
  <line class="gust g2" x1="40"  y1="300" x2="180" y2="300"/>
  <line class="gust g3" x1="70"  y1="360" x2="210" y2="360"/>

  <!-- 路面 -->
  <rect x="0" y="558" width="900" height="62" fill="#5f6368"/>
  <rect x="0" y="558" width="900" height="5" fill="#787d83"/>
  <line id="roadDash" x1="0" y1="588" x2="900" y2="588"
        stroke="#f7f3e8" stroke-width="6" stroke-dasharray="44 34"/>
  <ellipse cx="460" cy="562" rx="270" ry="9" fill="#00000026"/>

  <!-- ==================== 自行车 ==================== -->
  <g>
    <!-- 后轮 -->
    <circle cx="280" cy="460" r="92" fill="none" stroke="#2f3338" stroke-width="13"/>
    <circle cx="280" cy="460" r="80" fill="none" stroke="#c9d2d8" stroke-width="5"/>
    <g id="spokesRear" stroke="#9aa4ad" stroke-width="3">
      <line x1="280" y1="382" x2="280" y2="538"/>
      <line x1="202" y1="460" x2="358" y2="460"/>
      <line x1="225" y1="405" x2="335" y2="515"/>
      <line x1="335" y1="405" x2="225" y2="515"/>
      <line x1="202" y1="433" x2="358" y2="487"/>
      <line x1="202" y1="487" x2="358" y2="433"/>
      <circle cx="280" cy="438" r="3" fill="#6b7480" stroke="none"/>
    </g>
    <circle cx="280" cy="460" r="8" fill="#5b636c"/>

    <!-- 前轮 -->
    <circle cx="640" cy="460" r="92" fill="none" stroke="#2f3338" stroke-width="13"/>
    <circle cx="640" cy="460" r="80" fill="none" stroke="#c9d2d8" stroke-width="5"/>
    <g id="spokesFront" stroke="#9aa4ad" stroke-width="3">
      <line x1="640" y1="382" x2="640" y2="538"/>
      <line x1="562" y1="460" x2="718" y2="460"/>
      <line x1="585" y1="405" x2="695" y2="515"/>
      <line x1="695" y1="405" x2="585" y2="515"/>
      <line x1="562" y1="433" x2="718" y2="487"/>
      <line x1="562" y1="487" x2="718" y2="433"/>
      <circle cx="640" cy="438" r="3" fill="#6b7480" stroke="none"/>
    </g>
    <circle cx="640" cy="460" r="8" fill="#5b636c"/>

    <!-- 车架（红色） -->
    <g stroke="#e0483e" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="280" y1="460" x2="430" y2="465"/>   <!-- 后下叉 -->
      <line x1="280" y1="460" x2="398" y2="352"/>   <!-- 后上叉 -->
      <line x1="430" y1="465" x2="398" y2="352"/>   <!-- 座管 -->
      <line x1="398" y1="352" x2="592" y2="336"/>   <!-- 上管 -->
      <line x1="430" y1="465" x2="602" y2="384"/>   <!-- 下管 -->
      <line x1="592" y1="336" x2="602" y2="384"/>   <!-- 头管 -->
      <path d="M 602 384 Q 606 420 640 460"/>       <!-- 前叉 -->
    </g>

    <!-- 车把 -->
    <line x1="592" y1="336" x2="600" y2="318" stroke="#4a4f55" stroke-width="8" stroke-linecap="round"/>
    <path d="M 600 318 c 22 0 24 16 16 30" fill="none" stroke="#4a4f55" stroke-width="8" stroke-linecap="round"/>

    <!-- 车座 -->
    <line x1="398" y1="352" x2="394" y2="338" stroke="#6b7076" stroke-width="7"/>
    <path d="M 360 338 Q 392 320 424 334 Q 398 346 360 338 Z" fill="#7a4f2b"/>

    <!-- 链条 + 牙盘 + 后飞轮 -->
    <g stroke="#4d5359" stroke-width="4" stroke-dasharray="6 4">
      <line id="chainTop"    x1="430" y1="445" x2="280" y2="452"/>
      <line id="chainBottom" x1="430" y1="485" x2="280" y2="468"/>
    </g>
    <circle cx="430" cy="465" r="21" fill="none" stroke="#454b52" stroke-width="6"/>
    <circle cx="280" cy="460" r="9" fill="none" stroke="#454b52" stroke-width="5"/>

    <!-- 曲柄 + 脚踏（JS 驱动） -->
    <g id="crankGroup" stroke="#3d434a" stroke-width="8" stroke-linecap="round">
      <line id="crank1" x1="430" y1="465" x2="464" y2="465"/>
      <line id="crank2" x1="430" y1="465" x2="396" y2="465"/>
    </g>
    <g id="pedal1"><rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#2f3338"/></g>
    <g id="pedal2"><rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#2f3338"/></g>
  </g>

  <!-- ==================== 鹈鹕 ==================== -->
  <g id="pelican">
    <!-- 远侧腿（较暗，画在身体后面） -->
    <polyline id="legFar" points="" fill="none" stroke="#d1751f" stroke-width="13"
              stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footFar">
      <path d="M -6 -5 L 18 -3 L 26 2 L 16 3 L 21 8 L 9 8 L -6 5 Z" fill="#d1751f"/>
    </g>

    <!-- 身体 -->
    <g id="body">
      <!-- 尾羽 -->
      <polygon points="335,280 284,258 300,286 272,292 302,312 335,318"
               fill="#f4f3ec" stroke="#d8d8d0" stroke-width="3" stroke-linejoin="round"/>
      <!-- 脖子（先描边后填色，做出轮廓） -->
      <path d="M 428 292 C 468 292 476 250 474 216 C 472 188 482 172 500 166"
            fill="none" stroke="#d8d8d0" stroke-width="31" stroke-linecap="round"/>
      <path d="M 428 292 C 468 292 476 250 474 216 C 472 188 482 172 500 166"
            fill="none" stroke="#fdfdfa" stroke-width="25" stroke-linecap="round"/>
      <!-- 躯干 -->
      <ellipse cx="385" cy="298" rx="80" ry="54" fill="#fdfdfa" stroke="#d8d8d0" stroke-width="3"
               transform="rotate(-8 385 298)"/>
      <!-- 头（含眼周裸皮） -->
      <circle cx="503" cy="168" r="27" fill="#fdfdfa" stroke="#d8d8d0" stroke-width="3"/>
      <circle cx="508" cy="158" r="9.5" fill="#f7d9a0"/>
      <circle cx="509" cy="158" r="5" fill="#2b2b2b"/>
      <circle cx="511" cy="156" r="1.7" fill="#ffffff"/>
      <!-- 小头冠 -->
      <path d="M 486 148 q -8 -8 -14 -6 M 489 143 q -5 -9 -12 -10" fill="none"
            stroke="#d8d8d0" stroke-width="3" stroke-linecap="round"/>
      <!-- 大嘴：上喙 + 喉囊 -->
      <path d="M 513 155 L 648 182 L 648 187 L 517 167 Z" fill="#f6a51e" stroke="#d98c0a" stroke-width="2.5"/>
      <path d="M 518 167 Q 595 248 646 187 Q 585 210 518 167 Z"
            fill="#f28c28" stroke="#d98c0a" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="540" y1="164" x2="620" y2="177" stroke="#d98c0a" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- 近侧腿（画在身体前） -->
    <polyline id="legNear" points="" fill="none" stroke="#ef8b30" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footNear">
      <path d="M -6 -5 L 18 -3 L 26 2 L 16 3 L 21 8 L 9 8 L -6 5 Z" fill="#ef8b30"/>
    </g>

    <!-- 翅膀，搭在车把上 -->
    <g>
      <path d="M 415 272 C 470 266 545 300 608 342
               C 592 353 560 351 528 340 C 478 322 440 300 410 292 Z"
            fill="#f3f2ea" stroke="#d8d8d0" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 445 285 C 490 295 545 320 588 344 M 435 297 C 470 308 520 330 560 348"
            fill="none" stroke="#dcdcd2" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>

<script>
(() => {
  // 几何参考点
  const CRANK = { x: 430, y: 465, r: 34 };          // 曲柄中心与脚踏半径
  const LEG_NEAR = { hip: { x: 414, y: 330 }, l1: 86, l2: 98 };
  const LEG_FAR  = { hip: { x: 402, y: 338 }, l1: 88, l2: 96 };

  const $ = id => document.getElementById(id);
  const el = {
    crank1: $('crank1'), crank2: $('crank2'),
    pedal1: $('pedal1'), pedal2: $('pedal2'),
    footNear: $('footNear'), footFar: $('footFar'),
    legNear: $('legNear'), legFar: $('legFar'),
    spokesFront: $('spokesFront'), spokesRear: $('spokesRear'),
    roadDash: $('roadDash'), chainTop: $('chainTop'), chainBottom: $('chainBottom'),
    pelican: $('pelican'),
  };

  // 两段式腿部 IK：给定髋关节与脚踏位置，求膝盖（膝盖朝前）
  function knee(hip, foot, l1, l2) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 1), l1 + l2 - 1);
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    const k1 = { x: hip.x + a * ux - h * uy, y: hip.y + a * uy + h * ux };
    const k2 = { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
    return k1.x > k2.x ? k1 : k2;   // 取靠前（+x）的解
  }

  function setLeg(line, hip, foot, l1, l2) {
    const k = knee(hip, foot, l1, l2);
    line.setAttribute('points', `${hip.x},${hip.y} ${k.x},${k.y} ${foot.x},${foot.y}`);
  }

  let theta = 0, wheel = 0, last = performance.now();
  const CADENCE = 3.0;   // 踏频 rad/s

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    theta += CADENCE * dt;
    wheel += CADENCE * 1.9 * dt;

    // 车轮与路面
    el.spokesFront.setAttribute('transform', `rotate(${wheel * 57.2958} 640 460)`);
    el.spokesRear.setAttribute('transform', `rotate(${wheel * 57.2958} 280 460)`);
    el.roadDash.setAttribute('stroke-dashoffset', -(wheel * 57.2958 * 1.55));
    el.chainTop.setAttribute('stroke-dashoffset', -theta * 6);
    el.chainBottom.setAttribute('stroke-dashoffset', theta * 6);

    // 曲柄与脚踏
    const p1 = { x: CRANK.x + CRANK.r * Math.cos(theta),         y: CRANK.y + CRANK.r * Math.sin(theta) };
    const p2 = { x: CRANK.x - CRANK.r * Math.cos(theta),         y: CRANK.y - CRANK.r * Math.sin(theta) };
    el.crank1.setAttribute('x2', p1.x); el.crank1.setAttribute('y2', p1.y);
    el.crank2.setAttribute('x2', p2.x); el.crank2.setAttribute('y2', p2.y);
    el.pedal1.setAttribute('transform', `translate(${p1.x} ${p1.y})`);
    el.pedal2.setAttribute('transform', `translate(${p2.x} ${p2.y})`);

    // 腿 + 脚（脚踩在踏板上方一点）
    const f1 = { x: p1.x, y: p1.y - 6 }, f2 = { x: p2.x, y: p2.y - 6 };
    setLeg(el.legNear, LEG_NEAR.hip, f1, LEG_NEAR.l1, LEG_NEAR.l2);
    setLeg(el.legFar,  LEG_FAR.hip,  f2, LEG_FAR.l1,  LEG_FAR.l2);
    el.footNear.setAttribute('transform', `translate(${f1.x} ${f1.y})`);
    el.footFar.setAttribute('transform', `translate(${f2.x} ${f2.y})`);

    // 随踏频轻微上下起伏
    el.pelican.setAttribute('transform', `translate(0 ${Math.sin(theta * 2) * 2.2})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
