<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #173e45;
    --paper: #f9e9c9;
    --coral: #e85f4f;
    --teal: #1b716c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 20%, #2d5b5a 0%, #142f35 58%, #0b2026 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .frame {
    width: min(100vw, 1440px);
    padding: clamp(0px, 2vw, 24px);
  }

  .scene {
    display: block;
    width: 100%;
    height: auto;
    max-height: calc(100svh - 2 * clamp(0px, 2vw, 24px));
    margin: 0 auto;
    border-radius: clamp(0px, 1.2vw, 18px);
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .38),
      0 2px 0 rgba(255, 255, 255, .12) inset;
    background: #f9e9c9;
  }

  .eyebrow {
    font: 600 12px/1.2 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    letter-spacing: .28em;
    fill: #286b68;
  }

  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    fill: var(--ink);
  }

  .subtitle {
    font: 700 20px/1.1 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    letter-spacing: .34em;
    fill: var(--coral);
  }

  .caption {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 16px;
    letter-spacing: .02em;
    fill: #3e6665;
  }

  .stroke-ink { stroke: #294e52; }

  .wheel,
  .cloud,
  .glow,
  .shimmer,
  .gull {
    will-change: transform;
  }

  .cloud-a { animation: drift-a 14s ease-in-out infinite alternate; }
  .cloud-b { animation: drift-b 19s ease-in-out infinite alternate; }
  .cloud-c { animation: drift-c 23s ease-in-out infinite alternate; }

  .glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: glow-pulse 5.5s ease-in-out infinite alternate;
  }

  .shimmer {
    animation: shimmer-slide 7s ease-in-out infinite alternate;
  }

  .gull-a { animation: gull-bob 6s ease-in-out infinite alternate; }
  .gull-b { animation: gull-bob 7.5s ease-in-out infinite alternate-reverse; }

  #pelicanUpper {
    transform-box: fill-box;
    transform-origin: 60% 80%;
    animation: rider-bob 3.2s ease-in-out infinite alternate;
  }

  .scarf-tail {
    transform-origin: 741px 237px;
    transform-box: view-box;
    animation: scarf-wave 2.3s ease-in-out infinite alternate;
  }

  .scarf-tail-b {
    animation-duration: 2.8s;
    animation-direction: alternate-reverse;
  }

  .grass {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: grass-sway 4.4s ease-in-out infinite alternate;
  }

  .grass-b { animation-duration: 5.3s; animation-direction: alternate-reverse; }

  .speed-line {
    stroke-dasharray: 18 16;
    animation: speed-dash 1.1s linear infinite;
  }

  .speed-line:nth-child(2) { animation-duration: 1.45s; }
  .speed-line:nth-child(3) { animation-duration: .85s; }

  @keyframes drift-a {
    from { transform: translateX(-8px); }
    to   { transform: translateX(22px); }
  }
  @keyframes drift-b {
    from { transform: translateX(14px); }
    to   { transform: translateX(-18px); }
  }
  @keyframes drift-c {
    from { transform: translateX(-12px); }
    to   { transform: translateX(28px); }
  }
  @keyframes glow-pulse {
    from { opacity: .72; transform: scale(.94); }
    to   { opacity: 1;   transform: scale(1.06); }
  }
  @keyframes shimmer-slide {
    from { transform: translateX(-12px); }
    to   { transform: translateX(18px); }
  }
  @keyframes gull-bob {
    from { transform: translateY(-3px); }
    to   { transform: translateY(4px); }
  }
  @keyframes rider-bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-3px); }
  }
  @keyframes scarf-wave {
    from { transform: rotate(-2.5deg); }
    to   { transform: rotate(2.5deg); }
  }
  @keyframes grass-sway {
    from { transform: rotate(-2deg); }
    to   { transform: rotate(3deg); }
  }
  @keyframes speed-dash {
    to { stroke-dashoffset: -68; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RM = 44;
  const BB = { x: 632, y: 585 };
  const HIP_NEAR = { x: 609, y: 406 };
  const HIP_FAR = { x: 596, y: 419 };
  const THIGH = 108;
  const SHIN = 116;

  const $ = id => document.getElementById(id);
  const rearWheel = $('rearWheel');
  const frontWheel = $('frontWheel');
  const nearCrank = $('nearCrank');
  const farCrank = $('farCrank');
  const nearPedal = $('nearPedal');
  const farPedal = $('farPedal');
  const nearFoot = $('nearFoot');
  const farFoot = $('farFoot');
  const nearThigh = $('nearThigh');
  const nearShin = $('nearShin');
  const nearKnee = $('nearKnee');
  const farThigh = $('farThigh');
  const farShin = $('farShin');
  const farKnee = $('farKnee');

  function kneePoint(hip, foot) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(THIGH - SHIN) + 0.01, Math.min(d, THIGH + SHIN - 0.01));
    const ux = dx / Math.hypot(dx, dy);
    const uy = dy / Math.hypot(dx, dy);
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    return {
      x: hip.x + ux * a + uy * h,
      y: hip.y + uy * a - ux * h
    };
  }

  function drawLeg(hip, foot, thighEl, shinEl, kneeEl, footEl) {
    const knee = kneePoint(hip, foot);
    thighEl.setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}`);
    shinEl.setAttribute('d', `M${knee.x} ${knee.y}L${foot.x} ${foot.y - 2}`);
    kneeEl.setAttribute('cx', knee.x);
    kneeEl.setAttribute('cy', knee.y);
    footEl.setAttribute('transform', `translate(${foot.x} ${foot.y - 8})`);
  }

  function render(seconds) {
    const crank = seconds * 2.25 - Math.PI / 2;
    const wheelDeg = (seconds * 5.7 * 180) / Math.PI;

    rearWheel.setAttribute('transform', `rotate(${wheelDeg})`);
    frontWheel.setAttribute('transform', `rotate(${wheelDeg})`);

    const near = {
      x: BB.x + Math.cos(crank) * RM,
      y: BB.y + Math.sin(crank) * RM
    };
    const far = {
      x: BB.x - Math.cos(crank) * RM,
      y: BB.y - Math.sin(crank) * RM
    };

    nearCrank.setAttribute('x1', BB.x);
    nearCrank.setAttribute('y1', BB.y);
    nearCrank.setAttribute('x2', near.x);
    nearCrank.setAttribute('y2', near.y);
    farCrank.setAttribute('x1', BB.x);
    farCrank.setAttribute('y1', BB.y);
    farCrank.setAttribute('x2', far.x);
    farCrank.setAttribute('y2', far.y);

    nearPedal.setAttribute('transform', `translate(${near.x} ${near.y})`);
    farPedal.setAttribute('transform', `translate(${far.x} ${far.y})`);

    drawLeg(HIP_NEAR, near, nearThigh, nearShin, nearKnee, nearFoot);
    drawLeg(HIP_FAR, far, farThigh, farShin, farKnee, farFoot);
  }

  if (reduceMotion) {
    render(0.85);
  } else {
    const start = performance.now();
    const tick = now => {
      render((now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
