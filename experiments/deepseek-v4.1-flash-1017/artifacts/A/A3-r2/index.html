<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #1c3b40;
    --cream: #fff8e8;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f6dcb8;
  }

  body {
    display: grid;
    place-items: center;
    font-family: Georgia, "Times New Roman", serif;
  }

  .scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .cloud {
    animation: cloud-drift 14s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  .cloud--far {
    animation-duration: 20s;
    animation-direction: alternate-reverse;
  }

  .cloud--low {
    animation-duration: 17s;
    animation-delay: -5s;
  }

  @keyframes cloud-drift {
    from { transform: translateX(-18px); }
    to { transform: translateX(22px); }
  }

  .sun-halo {
    animation: breathe 6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes breathe {
    0%, 100% { opacity: .5; transform: scale(1); }
    50% { opacity: .8; transform: scale(1.035); }
  }

  .wave-layer--one { animation: current 13s linear infinite; }
  .wave-layer--two { animation: current 19s linear infinite reverse; }
  .wave-layer--three { animation: current 9s linear infinite; }

  @keyframes current {
    from { transform: translateX(0); }
    to { transform: translateX(-160px); }
  }

  .road-dash {
    animation: road-move 2.8s linear infinite;
  }

  @keyframes road-move {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -186; }
  }

  .scarf-tail {
    animation: flutter 1.9s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: 92% 50%;
  }

  .scarf-tail--under {
    animation-duration: 2.3s;
    animation-delay: -0.7s;
  }

  @keyframes flutter {
    from { transform: rotate(-2.8deg) translateY(1px); }
    to { transform: rotate(3.2deg) translateY(-2px); }
  }

  .crest {
    animation: crest-bob 2.2s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: bottom center;
  }

  @keyframes crest-bob {
    from { transform: rotate(-2deg); }
    to { transform: rotate(4deg); }
  }

  #eyelid {
    animation: blink 6.2s infinite;
    transform-box: fill-box;
    transform-origin: center top;
  }

  @keyframes blink {
    0%, 91%, 95%, 100% { transform: scaleY(0); }
    92.5%, 93.5% { transform: scaleY(1); }
  }

  .bell {
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
  }

  .bell:hover { filter: brightness(1.08); }

  .bell.is-ringing {
    animation: bell-ring .55s ease-out;
  }

  @keyframes bell-ring {
    0% { transform: rotate(0); }
    15% { transform: rotate(-14deg); }
    35% { transform: rotate(12deg); }
    55% { transform: rotate(-7deg); }
    75% { transform: rotate(4deg); }
    100% { transform: rotate(0); }
  }

  .ding {
    opacity: 0;
    pointer-events: none;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 21px;
    fill: #2e6f72;
    stroke: #fff8e8;
    stroke-width: 4px;
    paint-order: stroke fill;
    letter-spacing: .04em;
  }

  .ding.is-visible {
    animation: ding-pop 1.1s ease-out;
  }

  @keyframes ding-pop {
    0% { opacity: 0; transform: translate(0, 5px) scale(.8); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(4px, -28px) scale(1.04); }
  }

  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, transparent 45%, rgba(74, 41, 30, .16) 100%);
  }

  .sun-portrait,
  .portrait-clouds,
  .portrait-foreground {
    display: none;
  }

  @media (max-aspect-ratio: 17/20) {
    .sun-landscape,
    .desktop-foreground {
      display: none;
    }

    .sun-portrait,
    .portrait-clouds,
    .portrait-foreground {
      display: inline;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<main class="scene">
  <svg id="art" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="artTitle artDesc">
    <title id="artTitle">Pelican on a bicycle</title>
    <desc id="artDesc">A cheerful pelican in a red cap and teal scarf rides a teal bicycle along a sunny seaside promenade.</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#fdf1d8"/>

      <radialGradient id="sun" cx=".38" cy=".35" r=".7">

        <stop offset=".5" stop-color="#ffd07e"/>

      <linearGradient id="pouch" x1=".2" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#f8d077"/>
        <stop offset=".65" stop-color="#f4bd55"/>
        <stop offset="1" stop-color="#e9a944"/>

      <linearGradient id="wheelFade" x1="0" y1="0" x2="0" y2="1">

      <pattern id="ripples" width="160" height="26" patternUnits="userSpaceOnUse">

      <pattern id="paving" width="210" height="52" patternUnits="userSpaceOnUse">

        <circle cx="87" cy="25" r="1.7" fill="#cf9b6c" opacity=".3"/>

      <filter id="small-shadow" x="-60%" y="-80%" width="220%" height="260%">

      <filter id="grain" x="0" y="0" width="100%" height="100%">

        <feColorMatrix type="saturate" values="0"/>
      </filter>

      <radialGradient id="vignette" cx=".5" cy=".46" r=".74">
        <stop offset=".58" stop-color="#4a2a1d" stop-opacity="0"/>
        <stop offset="1" stop-color="#4a2a1d" stop-opacity=".16"/>

    <path d="M 1087 419 C 1116 400 1154 400 1200 416 L 1200 472 L 1060 472 Z" fill="#709793" opacity=".52"/>

    <!-- Sea -->

      <!-- Chainring -->

<script>
(() => {
  const art = document.getElementById('art');
  const rearInner = document.getElementById('rearInner');
  const frontInner = document.getElementById('frontInner');
  const chainring = document.getElementById('chainring');
  const nearCrank = document.getElementById('nearCrank');
  const farCrank = document.getElementById('farCrank');
  const nearPedal = document.getElementById('nearPedal');
  const farPedal = document.getElementById('farPedal');
  const nearLeg = document.getElementById('nearLeg');
  const nearLegOutline = document.getElementById('nearLegOutline');
  const nearFoot = document.getElementById('nearFoot');
  const farLeg = document.getElementById('farLeg');
  const farLegOutline = document.getElementById('farLegOutline');
  const farFoot = document.getElementById('farFoot');
  const bell = document.getElementById('bell');
  const ding = document.getElementById('ding');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setFrame() {
    const portrait = window.innerWidth / window.innerHeight < 0.85;
    art.setAttribute('viewBox', portrait ? '290 -200 620 1342' : '0 0 1200 800');
  }

  setFrame();
  window.addEventListener('resize', setFrame);
  window.addEventListener('orientationchange', setFrame);

  const crank = { x: 575, y: 610, radius: 47 };
  const nearHip = { x: 559, y: 474 };
  const farHip = { x: 543, y: 470 };
  const nearLengths = { a: 73, b: 83 };
  const farLengths = { a: 79, b: 91 };

  function solveKnee(hip, foot, lengths) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const rawDistance = Math.hypot(dx, dy);
    const distance = Math.min(Math.max(rawDistance, 1), lengths.a + lengths.b - 0.01);
    const ux = dx / rawDistance;
    const uy = dy / rawDistance;
    const along = (lengths.a * lengths.a - lengths.b * lengths.b + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, lengths.a * lengths.a - along * along));
    let px = -uy * height;
    let py = ux * height;
    if (px < 0) { px = -px; py = -py; }
    return {
      x: hip.x + ux * along + px,
      y: hip.y + uy * along + py
    };
  }

  function setLeg(foot, hip, lengths, outline, line, footEl) {
    const ankle = { x: foot.x, y: foot.y - 9 };
    const knee = solveKnee(hip, ankle, lengths);
    const d = `M ${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
    outline.setAttribute('d', d);
    line.setAttribute('d', d);
    footEl.setAttribute('transform', `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)})`);
  }

  function setCrank(angle, dir) {
    const near = {
      x: crank.x + Math.cos(angle) * crank.radius,
      y: crank.y + Math.sin(angle) * crank.radius
    };
    const far = {
      x: crank.x + Math.cos(angle + Math.PI) * crank.radius,
      y: crank.y + Math.sin(angle + Math.PI) * crank.radius
    };

    nearCrank.setAttribute('x2', near.x.toFixed(2));
    nearCrank.setAttribute('y2', near.y.toFixed(2));
    farCrank.setAttribute('x2', far.x.toFixed(2));
    farCrank.setAttribute('y2', far.y.toFixed(2));
    nearPedal.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
    farPedal.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);

    setLeg(near, nearHip, nearLengths, nearLegOutline, nearLeg, nearFoot);
    setLeg(far, farHip, farLengths, farLegOutline, farLeg, farFoot);

    chainring.setAttribute('transform', `rotate(${(angle * 180 / Math.PI * dir).toFixed(2)} 575 610)`);
    return { near, far };
  }

  function render(time) {
    const t = time / 1000;
    const wheelAngle = reduceMotion ? 0 : (t * 168) % 360;
    const pedalAngle = reduceMotion ? -0.72 : (-0.2 + t * 1.82) % (Math.PI * 2);

    rearInner.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)} 430 610)`);
    frontInner.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)} 760 610)`);
    setCrank(pedalAngle, 1);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

  let audioContext = null;
  function ring() {
    bell.classList.remove('is-ringing');
    ding.classList.remove('is-visible');
    void bell.getBoundingClientRect();
    bell.classList.add('is-ringing');
    ding.classList.add('is-visible');

    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const now = audioContext.currentTime;
      [1318.5, 1975.5].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(index ? 0.045 : 0.12, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.75 + index * 0.16);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + 0.95);
      });
    } catch (error) {
      /* Sound is a bonus; the visual ring still works. */
    }
  }

  bell.addEventListener('click', ring);
  bell.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      ring();
    }
  });
})();
