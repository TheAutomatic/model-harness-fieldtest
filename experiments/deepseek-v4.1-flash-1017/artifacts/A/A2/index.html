<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>骑自行车的鹈鹕</title>
<style>
  :root{
    --ink:#233746;
    --cream:#fff8e7;
    --coral:#e86a4a;
    --sun:#ffc85a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:#f7d7b0;
    font-family:"Trebuchet MS","Avenir Next","Segoe UI",sans-serif;
    color:var(--ink);
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100svh;
    overflow:hidden;
    isolation:isolate;
  }
  svg.scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 54%,rgba(70,42,25,.18) 100%);
    mix-blend-mode:multiply;
    z-index:2;
  }
  .masthead{
    position:absolute;
    z-index:3;
    top:clamp(18px,4vh,44px);
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    pointer-events:none;
    width:min(92vw,760px);
  }
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-size:clamp(8px,.85vw,11px);
    font-weight:800;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:#5c594c;
    margin-bottom:8px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    width:clamp(28px,5vw,64px);
    height:1px;
    background:currentColor;
    opacity:.55;
  }
  h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:clamp(27px,4.2vw,54px);
    line-height:1;
    letter-spacing:-.025em;
    color:#28404a;
    text-shadow:0 2px 0 rgba(255,248,231,.65);
  }
  h1 em{
    color:var(--coral);
    font-style:italic;
  }
  .caption{
    position:absolute;
    z-index:3;
    left:50%;
    bottom:clamp(14px,3vh,30px);
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 17px;
    border:1px solid rgba(50,62,61,.3);
    border-radius:999px;
    background:rgba(255,248,231,.66);
    backdrop-filter:blur(6px);
    box-shadow:0 4px 18px rgba(80,52,30,.1);
    font-size:clamp(9px,1vw,12px);
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    white-space:nowrap;
    color:#425050;
  }
  .caption .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 3px rgba(232,106,74,.18);
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div class="stage">
  <svg class="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="artTitle artDesc">

    <desc id="artDesc">黄昏的海滨木栈道上，一只白色鹈鹕戴着骑行帽，骑着一辆珊瑚色自行车，车篮里插着一条小鱼。</desc>

      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">

      <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#a5aa8d"/>

      <linearGradient id="bodyWhite" x1=".15" y1="0" x2=".8" y2="1">

        <stop offset=".58" stop-color="#f9f1dd"/>
        <stop offset="1" stop-color="#e7dac2"/>
      </linearGradient>
      <linearGradient id="wingWhite" x1=".1" y1="0" x2=".7" y2="1">

        <stop offset=".65" stop-color="#f3e9d4"/>
        <stop offset="1" stop-color="#ddceb4"/>

      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
