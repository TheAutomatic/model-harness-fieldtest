<!DOCTYPE html>

<meta charset="UTF-8">

<title>海边骑行的鹈鹕</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background:
      linear-gradient(180deg,
        #a5d6e0 0%,
        #c6e1dd 44%,
        #eadfc1 58%,
        #8fc2bf 70%,
        #f4d9aa 74%,
        #efce97 100%);
  }
  .scene {
    display: block;
    width: 100vw;
    height: 100vh;
    overflow: visible;
  }
  .cloud-a {
    transform-box: view-box;
    animation: drift-a 38s ease-in-out infinite alternate;
  }
  .cloud-b {
    transform-box: view-box;
    animation: drift-b 46s ease-in-out infinite alternate;
  }
  .cloud-c {
    transform-box: view-box;
    animation: drift-a 52s ease-in-out infinite alternate-reverse;
  }
  .boat {
    transform-box: view-box;
    transform-origin: 222px 558px;
    animation: boat-bob 6s ease-in-out infinite;
  }
  .scarf-tail {
    transform-box: view-box;
    transform-origin: 682px 306px;
    animation: scarf-flutter 2.4s ease-in-out infinite;
  }
  .scarf-tip {
    transform-box: view-box;
    transform-origin: 682px 306px;
    animation: scarf-flutter 2.9s ease-in-out -1.2s infinite reverse;
  }
  .eye {
    transform-box: view-box;
    transform-origin: 748px 218px;
    animation: blink 6.4s ease-in-out infinite;
  }
  .shimmer {
    animation: shimmer 4.5s ease-in-out infinite alternate;
  }
  .shimmer--late {
    animation-delay: -2.1s;
  }
  @keyframes drift-a {
    from { transform: translateX(-12px); }
    to   { transform: translateX(22px); }
  }
  @keyframes drift-b {
    from { transform: translateX(14px); }
    to   { transform: translateX(-20px); }
  }
  @keyframes boat-bob {
    0%, 100% { transform: translateY(0) rotate(-0.8deg); }
    50%      { transform: translateY(-5px) rotate(0.8deg); }
  }
  @keyframes scarf-flutter {
    0%, 100% { transform: rotate(-2.2deg) skewY(-0.8deg); }
    50%      { transform: rotate(2.6deg) skewY(1.2deg); }
  }
  @keyframes blink {
    0%, 91%, 95%, 100% { transform: scaleY(1); }
    92.5%              { transform: scaleY(0.08); }
  }
  @keyframes shimmer {
    from { opacity: 0.22; }
    to   { opacity: 0.62; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud-a, .cloud-b, .cloud-c, .boat, .scarf-tail, .scarf-tip, .eye, .shimmer {
      animation: none;
    }
  }
</style>

<script>
(() => {
  const rotors = [...document.querySelectorAll(".wheel-rotor")];
  const crank = document.getElementById("crank-arms");
  const nearPedal = document.getElementById("near-pedal");
  const farPedal = document.getElementById("far-pedal");
  const nearFoot = document.getElementById("near-foot");
  const farFoot = document.getElementById("far-foot");
  const nearLeg = document.getElementById("near-leg");
  const nearLegOutline = document.getElementById("near-leg-outline");
  const nearKnee = document.getElementById("near-knee-joint");
  const farLeg = document.getElementById("far-leg");
  const farLegOutline = document.getElementById("far-leg-outline");
  const farKnee = document.getElementById("far-knee-joint");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const crankCenter = { x: 585, y: 530 };
  const crankRadius = 40;
  const nearHip = { x: 552, y: 414 };
  const farHip = { x: 534, y: 419 };
  const thigh = 98;
  const shin = 91;

  let crankAngle = 38;
  let wheelAngle = 0;
  let lastTime = 0;
  let animationId = 0;
  let running = false;

  function solveKnee(hip, pedal) {
    const dx = pedal.x - hip.x;
    const dy = pedal.y - hip.y;
    const rawDistance = Math.hypot(dx, dy);
    const distance = Math.min(Math.max(rawDistance, 1), thigh + shin - 1.5);
    const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
    const ux = dx / rawDistance;
    const uy = dy / rawDistance;
    return {
      x: hip.x + along * ux + height * uy,
      y: hip.y + along * uy - height * ux
    };
  }

  function setLeg(hip, pedal, outlinePath, innerPath, kneeCircle) {
    const knee = solveKnee(hip, pedal);
    const ankle = { x: pedal.x, y: pedal.y - 11 };
    const d = `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${ankle.x} ${ankle.y}`;
    outlinePath.setAttribute("d", d);
    innerPath.setAttribute("d", d);
    kneeCircle.setAttribute("cx", knee.x.toFixed(2));
    kneeCircle.setAttribute("cy", knee.y.toFixed(2));
  }

  function setTransform(element, x, y) {
    element.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
  }

  function render(time) {
    if (!lastTime) lastTime = time;
    const delta = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if (!reduceMotion.matches) {
      crankAngle = (crankAngle + delta * 86) % 360;
      wheelAngle = (wheelAngle + delta * 193) % 360;
    }

    const radians = crankAngle * Math.PI / 180;
    const nearPedalPoint = {
      x: crankCenter.x + Math.cos(radians) * crankRadius,
      y: crankCenter.y + Math.sin(radians) * crankRadius
    };
    const farPedalPoint = {
      x: crankCenter.x - Math.cos(radians) * crankRadius,
      y: crankCenter.y - Math.sin(radians) * crankRadius
    };

    rotors.forEach((rotor) => {
      const cx = rotor.dataset.cx;
      const cy = rotor.dataset.cy;
      rotor.setAttribute("transform", `rotate(${wheelAngle.toFixed(3)} ${cx} ${cy})`);
    });

    crank.setAttribute("transform", `rotate(${crankAngle.toFixed(3)} 585 530)`);
    setTransform(nearPedal, nearPedalPoint.x, nearPedalPoint.y);
    setTransform(farPedal, farPedalPoint.x, farPedalPoint.y);
    setTransform(nearFoot, nearPedalPoint.x, nearPedalPoint.y - 10);
    setTransform(farFoot, farPedalPoint.x, farPedalPoint.y - 10);
    setLeg(nearHip, nearPedalPoint, nearLegOutline, nearLeg, nearKnee);
    setLeg(farHip, farPedalPoint, farLegOutline, farLeg, farKnee);

    if (running) animationId = requestAnimationFrame(render);
  }

  function start() {
    if (running) return;
    running = true;
    lastTime = 0;
    animationId = requestAnimationFrame(render);
  }

  function stop() {
    running = false;
    cancelAnimationFrame(animationId);
    render(performance.now());
  }

  render(performance.now());
  start();
  reduceMotion.addEventListener?.("change", () => {
    if (reduceMotion.matches) {
      stop();
    } else {
      start();
    }
  });
})();
</script>
