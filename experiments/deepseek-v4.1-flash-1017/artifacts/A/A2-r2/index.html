<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行 · Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #173b46;
    --cream: #fff8e7;
    --coral: #ef6f61;
    --sun: #ffd77a;
    --teal: #287c7b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 26%, rgba(255, 238, 175, .8) 0 9%, transparent 28%),
      linear-gradient(#8ed2d4 0%, #c6e6d5 43%, #f7d8a5 70%, #dca778 100%);
    color: var(--ink);
    font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    isolation: isolate;
  }
  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .poster {
    position: absolute;
    z-index: 5;
    top: clamp(24px, 5vw, 70px);
    left: clamp(24px, 6vw, 88px);
    pointer-events: none;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px;
    font-size: clamp(9px, .8vw, 12px);
    font-weight: 800;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #2f6d70;
  }
  .eyebrow::before {
    content: "";
    width: 32px;
    height: 2px;
    border-radius: 2px;
    background: var(--coral);
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 5.1vw, 74px);
    line-height: .92;
    letter-spacing: -.045em;
    font-weight: 400;
    color: var(--ink);
    text-wrap: balance;
  }
  h1 em {
    display: inline-block;
    color: var(--coral);
    font-weight: 400;
    transform: rotate(-3deg);
  }
  .sub {
    margin: 14px 0 0 2px;
    font-size: clamp(9px, .82vw, 12px);
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 700;
    color: #356d70;
  }
  .badge {
    position: absolute;
    z-index: 5;
    right: clamp(20px, 4vw, 56px);
    bottom: clamp(18px, 3.5vw, 44px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 15px 9px 11px;
    border: 1.5px solid rgba(23,59,70,.75);
    border-radius: 999px;
    background: rgba(255,248,231,.78);
    box-shadow: 0 5px 0 rgba(23,59,70,.1);
    backdrop-filter: blur(5px);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .badge span {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--coral);
    color: var(--cream);
    font-size: 13px;
  }
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    box-shadow: inset 0 0 110px rgba(31,75,78,.13);
    background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 18%, transparent 80%, rgba(82,51,39,.07));
  }
  .cloud { animation: drift var(--dur, 26s) linear infinite; }
  .cloud.c2 { animation-duration: 34s; animation-delay: -8s; }
  .cloud.c3 { animation-duration: 42s; animation-delay: -21s; }
  .cloud.c4 { animation-duration: 30s; animation-delay: -15s; }
  .wave { animation: wave-drift 7s ease-in-out infinite alternate; }
  .wave.w2 { animation-duration: 9s; animation-delay: -2s; }
  .wave.w3 { animation-duration: 11s; animation-delay: -4s; }
  .sailboat { animation: bob 5.5s ease-in-out infinite; }
  .bobber { animation: bob 3.2s ease-in-out infinite; }
  .scarves { animation: flutter 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
  .road-dashes { animation: road-scroll 2.6s linear infinite; }
  .speed-line { animation: speed 2.4s ease-in-out infinite; }
  .speed-line.s2 { animation-delay: -.9s; }
  .speed-line.s3 { animation-delay: -1.7s; }
  .sun-rays { animation: rays 24s linear infinite; transform-box: fill-box; transform-origin: center; }
  .bird { animation: fly 8s ease-in-out infinite; }
  .bird.b2 { animation-delay: -3s; }
  .bird.b3 { animation-delay: -5s; }
  @keyframes drift { to { transform: translateX(150px); } }
  @keyframes wave-drift { from { transform: translateX(-10px); } to { transform: translateX(18px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes flutter { from { transform: rotate(-2deg); } to { transform: rotate(3.5deg); } }
  @keyframes road-scroll { to { transform: translateX(-116px); } }
  @keyframes speed { 0%, 100% { opacity: 0; transform: translateX(12px); } 40% { opacity: .55; } 70% { opacity: 0; transform: translateX(-18px); } }
  @keyframes rays { to { transform: rotate(360deg); } }
  @keyframes fly { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(9px,-5px); } }
  @keyframes title-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 700px) {
    .poster { top: 22px; left: 22px; }
    h1 { font-size: clamp(27px, 8vw, 42px); }
    .sub { margin-top: 9px; }
    .badge {
      display: flex;
      right: 18px;
      bottom: 18px;
      padding: 7px 12px 7px 8px;
      font-size: 8px;
      letter-spacing: .13em;
    }
    .badge span { width: 20px; height: 20px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>

<script>
(() => {
  const svg = document.querySelector('.scene');
  const rearSpokes = document.getElementById('rear-spokes');
  const frontSpokes = document.getElementById('front-spokes');
  const crank = document.getElementById('crank');
  const nearPedal = document.getElementById('near-pedal');
  const farPedal = document.getElementById('far-pedal');
  const nearFoot = document.getElementById('near-foot');
  const farFoot = document.getElementById('far-foot');
  const nearOutline = document.getElementById('near-leg-outline');
  const nearInner = document.getElementById('near-leg-inner');
  const farOutline = document.getElementById('far-leg-outline');
  const farInner = document.getElementById('far-leg-inner');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const BB = { x: 640, y: 630 };
  const CRANK_R = 48;
  const legs = {
    near: { hip: { x: 589, y: 464 }, l1: 119, l2: 130, out: nearOutline, inner: nearInner, foot: nearFoot },
    far:  { hip: { x: 572, y: 452 }, l1: 117, l2: 132, out: farOutline, inner: farInner, foot: farFoot }
  };

  let crankAngle = 0.7;
  let wheelAngle = 0;
  let last = performance.now();

  function kneePoint(hip, foot, l1, l2) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const d = Math.max(1, Math.min(Math.hypot(dx, dy), l1 + l2 - 1));
    const ux = dx / d;
    const uy = dy / d;
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = hip.x + ux * a;
    const my = hip.y + uy * a;
    const k1 = { x: mx - uy * h, y: my + ux * h };
    const k2 = { x: mx + uy * h, y: my - ux * h };
    return k1.x > k2.x ? k1 : k2;
  }

  function drawLeg(leg, pedal) {
    const ankle = { x: pedal.x + 2, y: pedal.y - 7 };
    const knee = kneePoint(leg.hip, ankle, leg.l1, leg.l2);
    const d = `M ${leg.hip.x} ${leg.hip.y} L ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L ${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
    leg.out.setAttribute('d', d);
    leg.inner.setAttribute('d', d);
    leg.foot.setAttribute('transform', `translate(${pedal.x} ${pedal.y})`);
  }

  function render() {
    const nearAngle = crankAngle;
    const farAngle = crankAngle + Math.PI;
    const np = {
      x: BB.x + Math.cos(nearAngle) * CRANK_R,
      y: BB.y + Math.sin(nearAngle) * CRANK_R
    };
    const fp = {
      x: BB.x + Math.cos(farAngle) * CRANK_R,
      y: BB.y + Math.sin(farAngle) * CRANK_R
    };

    nearPedal.setAttribute('transform', `translate(${np.x.toFixed(1)} ${np.y.toFixed(1)})`);
    farPedal.setAttribute('transform', `translate(${fp.x.toFixed(1)} ${fp.y.toFixed(1)})`);
    crank.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${(nearAngle * 180 / Math.PI).toFixed(1)})`);
    rearSpokes.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
    frontSpokes.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
    drawLeg(legs.near, np);
    drawLeg(legs.far, fp);
  }

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    crankAngle = (crankAngle + dt * 2.15) % (Math.PI * 2);
    wheelAngle = (wheelAngle + dt * 235) % 360;
    render();
    if (!reduced) requestAnimationFrame(tick);
  }

  function fitScene() {
    const ratio = window.innerWidth / window.innerHeight;
    if (ratio < 1.05) {
      svg.setAttribute('viewBox', '250 110 710 690');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    } else {
      svg.setAttribute('viewBox', '0 0 1200 800');
      svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
    }
  }

  fitScene();
  window.addEventListener('resize', fitScene, { passive: true });
  render();
  if (!reduced) requestAnimationFrame(tick);
})();
</script>
