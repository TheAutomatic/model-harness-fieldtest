<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑单车 · Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #26343a;
    --cream: #fffaf0;
    --coral: #d95f49;
    --coral-dark: #a84132;
    --teal: #287c78;
    --orange: #efa044;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background: #f4e2c2;
    font-family: Georgia, "Times New Roman", serif;
  }

  .scene {
    width: 100vw;
    height: 100vh;
    display: block;
  }

  .cloud-a {
    animation: cloudDrift 17s ease-in-out infinite alternate;
  }
  .cloud-b {
    animation: cloudDrift 23s ease-in-out infinite alternate-reverse;
  }
  .wave-a {
    animation: waveDrift 11s linear infinite;
  }
  .wave-b {
    animation: waveDrift 16s linear infinite reverse;
  }
  .rider {
    animation: bob 2.7s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 560px 400px;
  }
  .head-group {
    animation: headTilt 4.2s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 664px 300px;
  }
  .scarf-tail {
    animation: flutter 1.35s ease-in-out infinite alternate;
    transform-box: view-box;
    transform-origin: 641px 287px;
  }
  .grass {
    animation: sway 3.4s ease-in-out infinite alternate;
    transform-box: view-box;
    transform-origin: center bottom;
  }
  .speed-line {
    animation: speed 2.6s linear infinite;
    opacity: 0;
  }
  .speed-line.s2 { animation-delay: .9s; }
  .speed-line.s3 { animation-delay: 1.7s; }

  @keyframes cloudDrift {
    from { transform: translateX(-8px); }
    to   { transform: translateX(18px); }
  }
  @keyframes waveDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-44px); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  @keyframes headTilt {
    0%, 100% { transform: rotate(-1.1deg); }
    50%      { transform: rotate(1.1deg); }
  }
  @keyframes flutter {
    from { transform: rotate(-3deg) skewY(-2deg); }
    to   { transform: rotate(4deg) skewY(2deg); }
  }
  @keyframes sway {
    from { transform: rotate(-2.5deg); }
    to   { transform: rotate(2.5deg); }
  }
  @keyframes speed {
    0%   { opacity: 0; transform: translateX(34px); }
    15%  { opacity: .7; }
    70%  { opacity: .35; }
    100% { opacity: 0; transform: translateX(-74px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud-a, .cloud-b, .wave-a, .wave-b, .rider, .head-group,
    .scarf-tail, .grass, .speed-line {
      animation: none !important;
    }
  }
</style>
</head>

        <path d="M579 295c34-11 75 6 94 39 10 17 19 28 35 37 8 4 8 13-2 16-20 6-48 1-66-14-17-13-28-31-37-48-6-12-13-21-24-30Z" fill="#fdf9f0" stroke="#d8cbb5" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M598 309c24 6 45 25 57 47 8 14 16 24 27 32" fill="none" stroke="#e5dac5" stroke-width="3" stroke-linecap="round"/>
        <path d="M611 329c13 7 24 20 31 35 5 11 10 19 18 25" fill="none" stroke="#e5dac5" stroke-width="2.5" stroke-linecap="round"/>
        <!-- dark primary feathers curled around grip -->
        <path d="M682 357c9 0 18 3 25 8 6 5 4 11-4 11-12 0-24-6-32-15Z" fill="#36474d"/>
        <path d="M679 366c7 1 13 4 18 9 2 3 0 6-4 6-7 0-13-3-18-8Z" fill="#2b3a40"/>
        <path d="M689 359c8 2 14 6 18 11" fill="none" stroke="#6b7d7e" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
        <path d="M685 370c6 1 10 3 13 6" fill="none" stroke="#8b9c9b" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
        <path d="M646 375c11 6 24 8 34 5" fill="none" stroke="#d8cbb5" stroke-width="2.3" stroke-linecap="round" opacity=".9"/>

        <!-- scarf tails flying over the shoulder -->
        <g class="scarf-tail">
          <path d="M633 281c-35-17-70-20-104-9 27 9 52 20 75 35 12-8 21-17 29-26Z" fill="#328d87"/>
          <path d="M624 291c-30-3-58 5-82 22 27 0 50 5 70 16 8-11 12-24 12-38Z" fill="#287c78"/>
          <path d="M563 277c18 5 35 13 50 23" fill="none" stroke="#7fc0ad" stroke-width="2.3" stroke-linecap="round" opacity=".7"/>
          <path d="M592 309c-8 4-15 9-21 15" fill="none" stroke="#1f625f" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
        </g>

        <!-- breast highlight and tiny feather marks -->
        <path d="M591 367c12 14 31 22 49 20" fill="none" stroke="#f7f0e1" stroke-width="5" stroke-linecap="round" opacity=".8"/>

    <!-- foreground highlight and flecks (in front of wheels) -->

      <circle cx="121" cy="733" r="3"/>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rearSpokes = $("rearSpokes");
  const frontSpokes = $("frontSpokes");
  const crankNear = $("crankNear");
  const crankFar = $("crankFar");
  const pedalNear = $("pedalNear");
  const pedalFar = $("pedalFar");
  const nearLeg = $("nearLeg");
  const farLeg = $("farLeg");
  const nearKnee = $("nearKnee");
  const nearFoot = $("nearFoot");
  const farFoot = $("farFoot");

  const CRANK = { x: 587, y: 542 };
  const CRANK_R = 28;
  const NEAR_HIP = { x: 568, y: 400 };
  const FAR_HIP = { x: 557, y: 398 };
  const THIGH = 84;
  const SHIN = 95;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let start = null;
  let paused = false;
  document.addEventListener("visibilitychange", () => {
    paused = document.hidden;
    if (!paused) start = null;
  });

  function legGeometry(hip, ankle, bendForward) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const d = Math.max(1, Math.min(THIGH + SHIN - 0.01, Math.hypot(dx, dy)));
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    const ux = dx / Math.hypot(dx, dy || 1);
    const uy = dy / Math.hypot(dx, dy || 1);
    const mx = hip.x + ux * a;
    const my = hip.y + uy * a;
    // Two possible knees; choose the one that bends in the riding direction.
    const sign = bendForward ? -1 : 1;
    return {
      x: mx + sign * (-uy) * h,
      y: my + sign * (ux) * h
    };
  }

  function setLeg(path, kneeEl, footEl, hip, ankle) {
    const knee = legGeometry(hip, ankle, true);
    if (path) path.setAttribute("d", `M${hip.x} ${hip.y} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`);
    if (kneeEl) {
      kneeEl.setAttribute("cx", knee.x.toFixed(1));
      kneeEl.setAttribute("cy", knee.y.toFixed(1));
    }
    if (footEl) footEl.setAttribute("transform", `translate(${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)})`);
  }

  function update(t) {
    // Wheel and crank speed are tied so the artwork feels mechanically coherent.
    const crankAngle = t * 1.18;
    const wheelAngle = t * 2.62;

    rearSpokes.setAttribute("transform", `rotate(${(wheelAngle * 57.2958).toFixed(2)} 390 592)`);
    frontSpokes.setAttribute("transform", `rotate(${(wheelAngle * 57.2958).toFixed(2)} 770 592)`);

    const nx = CRANK.x + Math.cos(crankAngle) * CRANK_R;
    const ny = CRANK.y + Math.sin(crankAngle) * CRANK_R;
    const fx = CRANK.x - Math.cos(crankAngle) * CRANK_R;
    const fy = CRANK.y - Math.sin(crankAngle) * CRANK_R;

    crankNear.setAttribute("x2", nx.toFixed(1));
    crankNear.setAttribute("y2", ny.toFixed(1));
    crankFar.setAttribute("x2", fx.toFixed(1));
    crankFar.setAttribute("y2", fy.toFixed(1));
    pedalNear.setAttribute("transform", `translate(${nx.toFixed(1)} ${ny.toFixed(1)})`);
    pedalFar.setAttribute("transform", `translate(${fx.toFixed(1)} ${fy.toFixed(1)})`);

    setLeg(nearLeg, nearKnee, nearFoot, NEAR_HIP, { x: nx, y: ny - 5 });
    setLeg(farLeg, null, farFoot, FAR_HIP, { x: fx, y: fy - 5 });
  }

  function frame(now) {
    if (start === null) start = now;
    const t = REDUCED ? 0.55 : (now - start) / 1000;
    if (!paused) update(t);
    requestAnimationFrame(frame);
  }

  update(0.55);
  requestAnimationFrame(frame);
})();
</script>
</body>
