<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
  <style>
    :root {
      --bg-page: #eef7fb;
      --card-shadow: 0 24px 60px rgba(24, 64, 89, 0.16);
      --pill-bg: rgba(255, 255, 255, 0.88);
      --pill-border: rgba(31, 78, 104, 0.14);
      --ink: #1e3d52;
      --accent: #f07b3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, #ffffff 0%, #e5f3f9 60%, #d4eaf4 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      padding: 20px;
      user-select: none;
    }

    .stage-wrap {
      position: relative;
      width: min(1040px, 100%);
      aspect-ratio: 1000 / 620;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      background: #dff3fc;
      border: 4px solid rgba(255, 255, 255, 0.9);
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(24, 64, 89, 0.08);
    }

    .title-tag {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      padding-right: 8px;
      border-right: 1px solid var(--pill-border);
    }

    button {
      appearance: none;
      border: 1px solid var(--pill-border);
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #f3f9fc;
      border-color: rgba(31, 78, 104, 0.3);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
    }

    button.primary:hover {
      background: #e36a2d;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      padding-left: 4px;
    }

    input[type="range"] {
      width: 96px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .stage-wrap { border-radius: 16px; border-width: 2px; }
      .title-tag { display: none; }
    }
  </style>
</head>
<body>

  <div class="hud">
    <span class="title-tag">🚲 海滨骑行鹈鹕</span>
    <button id="toggleBtn" class="primary">暂停</button>
    <button id="bellBtn">按车铃 🔔</button>
    <label class="speed-control">
      速度
      <input id="speedSlider" type="range" min="0.4" max="2.4" step="0.1" value="1.1" />
      <span id="speedVal">1.1x</span>
    </label>
  </div>

  <script>
    (() => {
      const SVG_NS = "http://www.w3.org/2000/svg";

      function el(tag, attrs = {}, parent = null) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          node.setAttribute(k, v);
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      // Build detailed spoked bicycle wheel
      function buildWheel(group, radius) {
        el("circle", {
          cx: 0, cy: 0, r: radius,
          fill: "none", stroke: "#283742", "stroke-width": 12
        }, group);
        el("circle", {
          cx: 0, cy: 0, r: radius - 5,
          fill: "none", stroke: "#e8dfc8", "stroke-width": 2.5
        }, group);
        el("circle", {
          cx: 0, cy: 0, r: radius - 8,
          fill: "none", stroke: "#c3d0d9", "stroke-width": 4.5
        }, group);

        const spokes = el("g", {}, group);
        const numSpokes = 14;
        for (let i = 0; i < numSpokes; i++) {
          const a = (i / numSpokes) * Math.PI * 2;
          const x2 = Math.cos(a) * (radius - 9);
          const y2 = Math.sin(a) * (radius - 9);
          el("line", {
            x1: 0, y1: 0, x2: x2.toFixed(2), y2: y2.toFixed(2),
            stroke: "#98a8b3", "stroke-width": 1.7
          }, spokes);
        }
        el("line", {
          x1: 0, y1: -(radius - 10), x2: 0, y2: -(radius - 19),
          stroke: "#f07b3f", "stroke-width": 3, "stroke-linecap": "round"
        }, spokes);

        el("circle", {
          cx: 0, cy: 0, r: 9,
          fill: "#dce6eb", stroke: "#223742", "stroke-width": 2.5
        }, group);
        el("circle", { cx: 0, cy: 0, r: 3.5, fill: "#223742" }, group);

        return spokes;
      }

      const rearSpokes = buildWheel(document.getElementById("rearWheel"), 85);
      const frontSpokes = buildWheel(document.getElementById("frontWheel"), 85);

      // Populate parallax clouds
      const cloudsLayer = document.getElementById("cloudsLayer");
      const cloudDefs = [
        { x: 140, y: 88, scale: 1.0, speed: 0.14 },
        { x: 460, y: 65, scale: 0.78, speed: 0.10 },
        { x: 740, y: 120, scale: 1.15, speed: 0.17 },
        { x: 970, y: 78, scale: 0.85, speed: 0.12 }
      ];
      const clouds = cloudDefs.map(c => {
        const g = el("g", {}, cloudsLayer);
        el("path", {
          d: "M -52 14 Q -58 -4 -36 -8 Q -28 -28 -2 -24 Q 24 -32 40 -10 Q 62 -8 58 14 Z",
          fill: "#ffffff"
        }, g);
        return { ...c, node: g };
      });

      // Sea wave glints
      const seaWaves = document.getElementById("seaWaves");
      const waveGlints = [];
      for (let i = 0; i < 14; i++) {
        const x = i * 85 + (i % 2) * 24;
        const y = 415 + (i % 3) * 13;
        const line = el("line", {
          x1: x, y1: y, x2: x + 28 + (i % 3) * 10, y2: y,
          stroke: "#ffffff", "stroke-width": 2.2, "stroke-linecap": "round"
        }, seaWaves);
        waveGlints.push({ x, y, node: line });
      }

      // Coastal grass tufts along seawall
      const bushesLayer = document.getElementById("bushesLayer");
      const tufts = [];
      for (let i = 0; i < 12; i++) {
        const x = i * 95 + (i % 2) * 20;
        const g = el("g", {}, bushesLayer);
        el("path", {
          d: "M -14 484 Q -10 468 0 472 Q 10 462 20 474 Q 28 470 32 484 Z",
          fill: i % 2 === 0 ? "#6ca654" : "#78b35e"
        }, g);
        tufts.push({ x, node: g });
      }

      // Road lane dashes & pebbles (exact ground-speed sync)
      const roadMarks = document.getElementById("roadMarks");
      const dashes = [];
      for (let i = 0; i < 11; i++) {
        const x = i * 110;
        const rect = el("rect", {
          x, y: 545, width: 52, height: 7, rx: 3.5,
          fill: "#f2e7c9", opacity: "0.75"
        }, roadMarks);
        dashes.push({ x, node: rect });
      }
      const pebbles = [];
      for (let i = 0; i < 18; i++) {
        const x = i * 64 + (i % 3) * 17;
        const y = 505 + ((i * 29) % 98);
        const dot = el("ellipse", {
          cx: x, cy: y, rx: 3 + (i % 3), ry: 1.6,
          fill: "#3b4952", opacity: "0.55"
        }, roadMarks);
        pebbles.push({ x, y, node: dot });
      }

      // Kinematics Constants
      const WHEEL_R = 85;
      const BB_X = 465;
      const BB_Y = 415;
      const CRANK_R = 32;
      const L1 = 96;
      const L2 = 90;

      // DOM Handles
      const pelicanUpper = document.getElementById("pelicanUpper");
      const pelicanHead = document.getElementById("pelicanHead");
      const pouchPath = document.getElementById("pouchPath");
      const pouchHighlight = document.getElementById("pouchHighlight");
      const scarfTail = document.getElementById("scarfTail");
      const scarfTail2 = document.getElementById("scarfTail2");
      const nearWingGroup = document.getElementById("nearWingGroup");
      const farWingGroup = document.getElementById("farWingGroup");
      const nearThighCuff = document.getElementById("nearThighCuff");

      const nearLegOutline = document.getElementById("nearLegOutline");
      const nearLegFill = document.getElementById("nearLegFill");
      const nearFoot = document.getElementById("nearFoot");
      const nearCrankArm = document.getElementById("nearCrankArm");
      const nearCrankArmFill = document.getElementById("nearCrankArmFill");
      const nearPedal = document.getElementById("nearPedal");

      const farLegOutline = document.getElementById("farLegOutline");
      const farLegFill = document.getElementById("farLegFill");
      const farFoot = document.getElementById("farFoot");
      const farCrankArm = document.getElementById("farCrankArm");
      const farPedal = document.getElementById("farPedal");

      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");
      const bellGroup = document.getElementById("bellGroup");
      const bellClapper = document.getElementById("bellClapper");
      const bellBubble = document.getElementById("bellBubble");
      const basketFish = document.getElementById("basketFish");

      function solveLegIK(hipX, hipY, footX, footY, l1, l2) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        let dist = Math.hypot(dx, dy);
        const maxReach = l1 + l2 - 1.5;
        const minReach = Math.abs(l1 - l2) + 2;
        if (dist > maxReach) dist = maxReach;
        if (dist < minReach) dist = minReach;

        const baseAngle = Math.atan2(dy, dx);
        const cosA = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
        const clampedCos = Math.max(-1, Math.min(1, cosA));
        const offsetAngle = Math.acos(clampedCos);

        const kneeAngle = baseAngle - offsetAngle;
        const kneeX = hipX + Math.cos(kneeAngle) * l1;
        const kneeY = hipY + Math.sin(kneeAngle) * l1;
        return { kneeX, kneeY };
      }

      let running = true;
      let speedMul = 1.1;
      let wheelAngle = 0;
      let crankAngle = 0.4;
      let elapsed = 0;
      let lastTs = null;
      let blinkTimer = 2.5;
      let bellTimer = 0;

      const toggleBtn = document.getElementById("toggleBtn");
      const bellBtn = document.getElementById("bellBtn");
      const speedSlider = document.getElementById("speedSlider");
      const speedVal = document.getElementById("speedVal");

      toggleBtn.addEventListener("click", () => {
        running = !running;
        toggleBtn.textContent = running ? "暂停" : "继续";
        toggleBtn.classList.toggle("primary", running);
      });

      speedSlider.addEventListener("input", () => {
        speedMul = parseFloat(speedSlider.value);
        speedVal.textContent = speedMul.toFixed(1) + "x";
      });

      function ringBell() {
        bellTimer = 1.15;
      }
      bellBtn.addEventListener("click", ringBell);
      bellGroup.addEventListener("click", ringBell);
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          ringBell();
        }
      });

      function update(ts) {
        if (lastTs === null) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        if (running) {
          elapsed += dt * speedMul;

          const crankOmega = 3.4 * speedMul;
          const dCrank = crankOmega * dt;
          crankAngle += dCrank;

          const dWheel = dCrank * 0.92;
          wheelAngle += dWheel;

          const dx = dWheel * WHEEL_R;

          for (const d of dashes) {
            d.x -= dx;
            if (d.x < -70) d.x += 11 * 110;
            d.node.setAttribute("x", d.x.toFixed(1));
          }

          for (const p of pebbles) {
            p.x -= dx;
            if (p.x < -20) p.x += 18 * 64;
            p.node.setAttribute("cx", p.x.toFixed(1));
          }

          for (const t of tufts) {
            t.x -= dx * 0.82;
            if (t.x < -45) t.x += 12 * 95;
            t.node.setAttribute("transform", `translate(${t.x.toFixed(1)}, 0)`);
          }

          for (const w of waveGlints) {
            w.x -= dx * 0.12;
            if (w.x < -50) w.x += 14 * 85;
            w.node.setAttribute("x1", w.x.toFixed(1));
            w.node.setAttribute("x2", (w.x + 32).toFixed(1));
          }

          for (const c of clouds) {
            c.x -= (14 + c.speed * 45 * speedMul) * dt;
            if (c.x < -90) c.x = 1090;
            c.node.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`);
          }

          blinkTimer -= dt;
          if (blinkTimer <= 0) {
            blinkTimer = 2.6 + Math.random() * 2.4;
          }
          const isBlinking = blinkTimer < 0.13;
          eyeOpen.style.display = isBlinking ? "none" : "block";
          eyeClosed.style.display = isBlinking ? "block" : "none";
        }

        if (bellTimer > 0) {
          bellTimer = Math.max(0, bellTimer - dt);
          const prog = 1 - bellTimer / 1.15;
          const wiggle = Math.sin(prog * Math.PI * 10) * 18 * (1 - prog);
          bellClapper.setAttribute("transform", `rotate(${wiggle.toFixed(1)} 8 -2)`);
          const alpha = prog < 0.15 ? prog / 0.15 : Math.max(0, 1 - (prog - 0.5) / 0.5);
          const lift = -prog * 18;
          bellBubble.setAttribute("opacity", alpha.toFixed(2));
          bellBubble.setAttribute("transform", `translate(592, ${(198 + lift).toFixed(1)})`);
        } else {
          bellBubble.setAttribute("opacity", "0");
          bellClapper.removeAttribute("transform");
        }

        const wheelDeg = (wheelAngle * 180) / Math.PI;
        rearSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        frontSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);

        const bobY = Math.sin(crankAngle * 2 - 0.5) * 3.2;
        const leanDeg = Math.cos(crankAngle) * 1.4;
        pelicanUpper.setAttribute("transform", `translate(0, ${bobY.toFixed(2)}) rotate(${leanDeg.toFixed(2)} 398 282)`);

        const headBob = Math.sin(crankAngle * 2 - 1.1) * 2.0;
        pelicanHead.setAttribute("transform", `translate(0, ${headBob.toFixed(2)})`);

        const pouchDrop = 186 + Math.sin(crankAngle * 2 - 1.5) * 4.5;
        pouchPath.setAttribute(
          "d",
          `M 498 136 C 510 ${pouchDrop.toFixed(1)}, 548 ${(pouchDrop + 8).toFixed(1)}, 588 ${(pouchDrop - 11).toFixed(1)} C 610 ${(pouchDrop - 22).toFixed(1)}, 624 156, 632 152 L 498 136 Z`
        );
        pouchHighlight.setAttribute(
          "d",
          `M 526 ${(pouchDrop - 22).toFixed(1)} Q 558 ${(pouchDrop - 10).toFixed(1)} 594 ${(pouchDrop - 24).toFixed(1)}`
        );

        const flutter1 = Math.sin(elapsed * 9.5) * 8;
        const flutter2 = Math.cos(elapsed * 8.2) * 7;
        scarfTail.setAttribute(
          "d",
          `M 436 202 Q 382 ${(182 + flutter1 * 0.6).toFixed(1)} 320 ${(196 + flutter1).toFixed(1)} Q 350 ${(210 + flutter1 * 0.8).toFixed(1)} 414 210 Z`
        );
        scarfTail2.setAttribute(
          "d",
          `M 436 208 Q 388 ${(200 + flutter2 * 0.5).toFixed(1)} 336 ${(216 + flutter2).toFixed(1)} Q 368 ${(224 + flutter2 * 0.7).toFixed(1)} 420 216 Z`
        );

        const fishBob = Math.sin(crankAngle * 2) * 2.2;
        basketFish.setAttribute("transform", `translate(8, ${(-11 + fishBob).toFixed(2)}) rotate(${(-28 + fishBob * 2.5).toFixed(1)})`);

        const wingCounter = -bobY * 0.5;
        nearWingGroup.setAttribute("transform", `translate(0, ${wingCounter.toFixed(2)})`);
        farWingGroup.setAttribute("transform", `translate(0, ${(bobY * 0.4).toFixed(2)})`);

        // Near Pedal & IK
        const nearPX = BB_X + Math.cos(crankAngle) * CRANK_R;
        const nearPY = BB_Y + Math.sin(crankAngle) * CRANK_R;
        nearCrankArm.setAttribute("x2", nearPX.toFixed(2));
        nearCrankArm.setAttribute("y2", nearPY.toFixed(2));
        nearCrankArmFill.setAttribute("x2", nearPX.toFixed(2));
        nearCrankArmFill.setAttribute("y2", nearPY.toFixed(2));
        nearPedal.setAttribute("transform", `translate(${nearPX.toFixed(2)}, ${nearPY.toFixed(2)})`);

        const nearHipX = 398;
        const nearHipY = 278 + bobY * 0.75;
        nearThighCuff.setAttribute("cy", (nearHipY - 2).toFixed(2));
        const nearAnkleX = nearPX - 3;
        const nearAnkleY = nearPY - 6;
        const nearKnee = solveLegIK(nearHipX, nearHipY, nearAnkleX, nearAnkleY, L1, L2);
        const nearPathD = `M ${nearHipX} ${nearHipY.toFixed(2)} L ${nearKnee.kneeX.toFixed(2)} ${nearKnee.kneeY.toFixed(2)} L ${nearAnkleX.toFixed(2)} ${nearAnkleY.toFixed(2)}`;
        nearLegOutline.setAttribute("d", nearPathD);
        nearLegFill.setAttribute("d", nearPathD);
        const nearFootTilt = Math.sin(crankAngle) * 7;
        nearFoot.setAttribute("transform", `translate(${nearAnkleX.toFixed(2)}, ${(nearAnkleY - 1).toFixed(2)}) rotate(${nearFootTilt.toFixed(1)})`);

        // Far Pedal & IK
        const farAngle = crankAngle + Math.PI;
        const farPX = BB_X + Math.cos(farAngle) * CRANK_R;
        const farPY = BB_Y + Math.sin(farAngle) * CRANK_R;
        farCrankArm.setAttribute("x2", farPX.toFixed(2));
        farCrankArm.setAttribute("y2", farPY.toFixed(2));
        farPedal.setAttribute("transform", `translate(${farPX.toFixed(2)}, ${farPY.toFixed(2)})`);

        const farHipX = 410;
        const farHipY = 276 + bobY * 0.75;
        const farAnkleX = farPX - 3;
        const farAnkleY = farPY - 5;
        const farKnee = solveLegIK(farHipX, farHipY, farAnkleX, farAnkleY, L1, L2);
        const farPathD = `M ${farHipX} ${farHipY.toFixed(2)} L ${farKnee.kneeX.toFixed(2)} ${farKnee.kneeY.toFixed(2)} L ${farAnkleX.toFixed(2)} ${farAnkleY.toFixed(2)}`;
        farLegOutline.setAttribute("d", farPathD);
        farLegFill.setAttribute("d", farPathD);
        const farFootTilt = Math.sin(farAngle) * 7;
        farFoot.setAttribute("transform", `translate(${farAnkleX.toFixed(2)}, ${(farAnkleY - 1).toFixed(2)}) rotate(${farFootTilt.toFixed(1)})`);

        requestAnimationFrame(update);
      }

      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
