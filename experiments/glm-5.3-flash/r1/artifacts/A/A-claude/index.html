<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚲 鹈鹕骑行</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
    background: linear-gradient(#eaf6ff, #cfe9fb);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { font-size: 26px; color: #23527c; letter-spacing: 3px; }
  .stage {
    width: min(940px, 96vw);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 45px rgba(30, 60, 110, .28);
    background: #bfe6fb;
  }
  svg { display: block; width: 100%; height: auto; }
  .tip { font-size: 13px; color: #5b7fa6; }

  /* ---------- 滚动的世界 ---------- */
  @keyframes drift { from { transform: translateX(880px); } to { transform: translateX(-280px); } }
  .cloudA { animation: drift 55s linear infinite; animation-delay: -20s; }
  .cloudB { animation: drift 75s linear infinite; animation-delay: -46s; }
  .cloudC { animation: drift 42s linear infinite; animation-delay: -8s; }
  .birdfly1 { animation: drift 38s linear infinite; animation-delay: -12s; }
  .birdfly2 { animation: drift 47s linear infinite; animation-delay: -30s; }

  @keyframes scrollSlow { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  .scenery { animation: scrollSlow 70s linear infinite; }

  @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 70; } }
  .roadline { animation: dash .38s linear infinite; }

  @keyframes chainMove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 8; } }
  .chain { animation: chainMove .3s linear infinite; }

  @keyframes sunspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .sunrays { transform-origin: 105px 95px; animation: sunspin 40s linear infinite; }

  @keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  .fishtail { transform-box: fill-box; transform-origin: 0% 50%; animation: sway .6s ease-in-out infinite; }

  @keyframes flagwave { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(9deg); } }
  .flag { transform-box: fill-box; transform-origin: 0% 50%; animation: flagwave 1s ease-in-out infinite; }

  @keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.35); } }
  .flap { transform-box: fill-box; transform-origin: 50% 50%; animation: flap .5s ease-in-out infinite; }
  .flap2 { animation-delay: .25s; }

  @keyframes windmove { 0% { transform: translateX(50px); opacity: 0; } 25% { opacity: .8; } 100% { transform: translateX(-170px); opacity: 0; } }
  .wind1 { animation: windmove 1.1s linear infinite; }
  .wind2 { animation: windmove 1.4s linear infinite; animation-delay: .3s; }
  .wind3 { animation: windmove 1.2s linear infinite; animation-delay: .6s; }

  @keyframes puff { from { transform: translate(0,0); opacity: .5; } to { transform: translate(-90px,-34px); opacity: 0; } }
  .puff  { animation: puff .95s linear infinite; }
  .puffB { animation: puff .95s linear infinite; animation-delay: .45s; }

  @media (prefers-reduced-motion: reduce) {
    .cloudA,.cloudB,.cloudC,.birdfly1,.birdfly2,.scenery,.roadline,.chain,
    .sunrays,.fishtail,.flag,.flap,.flap2,.wind1,.wind2,.wind3,.puff,.puffB { animation: none; }
  }
</style>
</head>
<body>
  <h1>🚲 鹈鹕骑行</h1>
  <div class="stage">

    <circle cx="405" cy="398" r="17" fill="#dde2e9" stroke="#98a1ad" stroke-width="3"/>

  <p class="tip">双腿真实地蹬着踏板 · 车轮、链条、公路虚线速度同步 · 直接双击打开即可观看</p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rearWheel = $('rearWheel'), frontWheel = $('frontWheel');
  var nearCrank = $('nearCrank'), farCrank = $('farCrank');
  var nearPedal = $('nearPedal'), farPedal = $('farPedal');
  var pelican = $('pelican'), headG = $('head');
  var nThigh = $('nThigh'), nThigh2 = $('nThigh2'), nShin = $('nShin'), nKnee = $('nKnee'), nFoot = $('nFoot');
  var fThigh = $('fThigh'), fThigh2 = $('fThigh2'), fShin = $('fShin'), fKnee = $('fKnee'), fFoot = $('fFoot');

  var BB = { x: 405, y: 398 };   // 中轴
  var CRANK = 38;                // 曲柄长
  var HIP = { x: 356, y: 262 };  // 髋关节
  var L1 = 95, L2 = 91;          // 大腿 / 小腿长

  function deg(r) { return r * 180 / Math.PI; }
  function fmt(n) { return n.toFixed(1); }

  // 两段式逆运动学：已知髋和脚踝，求膝盖（膝盖取靠前的一侧）
  function solveLeg(thigh, thigh2, shin, kneeC, footG, hx, hy, ax, ay, crankRad) {
    var dx = ax - hx, dy = ay - hy;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var d = Math.max(Math.abs(L1 - L2) + 0.5, Math.min(dist, L1 + L2 - 0.5));
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / dist, uy = dy / dist;
    var kx = hx + a * ux + h * uy;
    var ky = hy + a * uy - h * ux;
    setLine(thigh, hx, hy, kx, ky);
    setLine(thigh2, hx, hy, kx, ky);
    setLine(shin, kx, ky, ax, ay);
    kneeC.setAttribute('cx', fmt(kx));
    kneeC.setAttribute('cy', fmt(ky));
    footG.setAttribute('transform', 'translate(' + fmt(ax) + ' ' + fmt(ay) + ') rotate(' + fmt(-deg(crankRad)) + ')');
  }
  function setLine(el, x1, y1, x2, y2) {
    el.setAttribute('x1', fmt(x1)); el.setAttribute('y1', fmt(y1));
    el.setAttribute('x2', fmt(x2)); el.setAttribute('y2', fmt(y2));
  }

  var wheel = 0, crank = 0, last = performance.now();
  var reduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function update(dt) {
    wheel += 2.6 * dt;   // 车轮角速度
    crank += 1.55 * dt;  // 踏频

    var wd = fmt(deg(wheel)), cd = deg(crank);
    rearWheel.setAttribute('transform', 'rotate(' + wd + ' 300 400)');
    frontWheel.setAttribute('transform', 'rotate(' + wd + ' 500 400)');
    nearCrank.setAttribute('transform', 'rotate(' + fmt(cd) + ' 405 398)');
    farCrank.setAttribute('transform', 'rotate(' + fmt(cd + 180) + ' 405 398)');

    var p1x = BB.x + CRANK * Math.cos(crank),         p1y = BB.y + CRANK * Math.sin(crank);
    var p2x = BB.x + CRANK * Math.cos(crank + Math.PI), p2y = BB.y + CRANK * Math.sin(crank + Math.PI);
    nearPedal.setAttribute('transform', 'translate(' + fmt(p1x) + ' ' + fmt(p1y) + ') rotate(' + fmt(-cd) + ')');
    farPedal.setAttribute('transform', 'translate(' + fmt(p2x) + ' ' + fmt(p2y) + ') rotate(' + fmt(-deg(crank + Math.PI)) + ')');

    // 身体随踩踏轻轻起伏，头部微微一点一点
    var bob = 2.4 * Math.sin(crank * 2);
    pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    headG.setAttribute('transform', 'rotate(' + (2.5 * Math.sin(crank * 2 + 0.7)).toFixed(2) + ' 452 118)');

    var hy = HIP.y + bob;
    solveLeg(nThigh, nThigh2, nShin, nKnee, nFoot, HIP.x, hy, p1x, p1y - 8, crank);
    solveLeg(fThigh, fThigh2, fShin, fKnee, fFoot, HIP.x, hy, p2x, p2y - 8, crank + Math.PI);
  }

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    requestAnimationFrame(loop);
  }

  if (reduced) { update(0.55); } else { requestAnimationFrame(loop); }
})();
