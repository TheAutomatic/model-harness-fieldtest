<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #bfe6f7; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 100vw; height: 100vh; max-width: 1100px; display: block; }

  /* 车轮转动 */
  .wheel-spin  { animation: spin 1.6s linear infinite; transform-origin: center; transform-box: fill-box; }
  .crank-spin  { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 鹈鹕身体随踩踏轻微起伏 */
  .pelican { animation: bob 0.8s ease-in-out infinite alternate; transform-origin: 640px 300px; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  /* 双腿蹬踏（配合曲柄 1.6s 一圈的相位） */
  .leg-far  { animation: pedal-far 1.6s linear infinite; }
  .leg-near { animation: pedal-near 1.6s linear infinite; }
  @keyframes pedal-far {
    0%   { transform: rotate( 18deg); }
    50%  { transform: rotate(-16deg); }
    100% { transform: rotate( 18deg); }
  }
  @keyframes pedal-near {
    0%   { transform: rotate(-16deg); }
    50%  { transform: rotate( 18deg); }
    100% { transform: rotate(-16deg); }
  }
  .leg-far  { transform-origin: 600px 395px; }
  .leg-near { transform-origin: 600px 395px; }

  /* 云朵飘动 */
  .cloud1 { animation: drift 30s linear infinite; }
  .cloud2 { animation: drift 45s linear infinite; animation-delay: -15s; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1100px); } }
</style>
</head>
<body>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf0"/>
      <stop offset="1" stop-color="#dff3fb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="790" cy="90" r="48" fill="#ffd95e"/>
  <g stroke="#ffd95e" stroke-width="5" stroke-linecap="round">
    <line x1="790" y1="20" x2="790" y2="32"/>
    <line x1="790" y1="148" x2="790" y2="160"/>
    <line x1="720" y1="90" x2="732" y2="90"/>
    <line x1="848" y1="90" x2="860" y2="90"/>
    <line x1="741" y1="41" x2="750" y2="50"/>
    <line x1="830" y1="130" x2="839" y2="139"/>
    <line x1="839" y1="41" x2="830" y2="50"/>
    <line x1="750" y1="130" x2="741" y2="139"/>
  </g>

  <!-- 云 -->
  <g class="cloud1" fill="#ffffff" opacity="0.9">
    <ellipse cx="0" cy="110" rx="55" ry="22"/>
    <ellipse cx="40" cy="98" rx="40" ry="18"/>
    <ellipse cx="-38" cy="100" rx="35" ry="16"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity="0.8">
    <ellipse cx="0" cy="180" rx="48" ry="19"/>
    <ellipse cx="34" cy="170" rx="32" ry="14"/>
  </g>

  <!-- 地面 / 公路 -->
  <rect x="0" y="520" width="900" height="80" fill="#7fbf6a"/>
  <rect x="0" y="512" width="900" height="10" fill="#6aa858"/>
  <rect x="0" y="522" width="900" height="78" fill="#8a8a8a"/>
  <g stroke="#e8e8e8" stroke-width="5" stroke-dasharray="50 40">
    <line x1="0" y1="566" x2="900" y2="566"/>
  </g>

  <!-- 远处小山 -->
  <path d="M -40 522 Q 130 400 300 522 Z" fill="#a5d68d"/>
  <path d="M 220 522 Q 420 380 620 522 Z" fill="#b3df9c"/>

  <!-- ====== 自行车 ====== -->
  <!-- 后轮 -->
  <g transform="translate(360 460)">
    <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
    <circle r="56" fill="none" stroke="#555" stroke-width="2"/>
    <g class="wheel-spin" stroke="#999" stroke-width="3">
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="-40" y1="40" x2="40" y2="-40"/>
      <line x1="-52" y1="-22" x2="52" y2="22"/>
      <line x1="-52" y1="22" x2="52" y2="-22"/>
    </g>
    <circle r="9" fill="#444"/>
  </g>

  <!-- 前轮 -->
  <g transform="translate(660 460)">
    <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
    <circle r="56" fill="none" stroke="#555" stroke-width="2"/>
    <g class="wheel-spin" stroke="#999" stroke-width="3">
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="-40" y1="40" x2="40" y2="-40"/>
      <line x1="-52" y1="-22" x2="52" y2="22"/>
      <line x1="-52" y1="22" x2="52" y2="-22"/>
    </g>
    <circle r="9" fill="#444"/>
  </g>

  <!-- 车架 -->
  <g stroke="#d94f3d" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="360" y1="460" x2="510" y2="460"/>           <!-- 后轴-五通 -->
    <line x1="510" y1="460" x2="600" y2="340"/>           <!-- 五通-座管顶 -->
    <line x1="360" y1="460" x2="600" y2="340"/>           <!-- 后轴-座管顶 -->
    <line x1="600" y1="340" x2="590" y2="318"/>           <!-- 座管延伸 -->
    <line x1="600" y1="340" x2="640" y2="460"/>           <!-- 座管顶-前轴 -->
    <line x1="510" y1="460" x2="640" y2="400"/>           <!-- 下管-前叉顶 -->
    <line x1="640" y1="400" x2="660" y2="460"/>           <!-- 前叉 -->
  </g>

  <!-- 车把 -->
  <g stroke="#444" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="640" y1="400" x2="628" y2="368"/>
    <path d="M 628 368 Q 622 350 606 352"/>
  </g>
  <circle cx="606" cy="352" r="7" fill="#3a3a3a"/>       <!-- 把套 -->

  <!-- 车座 -->
  <path d="M 570 314 Q 600 304 632 316 Q 606 326 570 314 Z" fill="#3a3a3a"/>

  <!-- 曲柄与踏板 -->
  <g transform="translate(510 460)">
    <g class="crank-spin">
      <circle r="20" fill="none" stroke="#555" stroke-width="5"/>
      <line x1="0" y1="0" x2="34" y2="-34" stroke="#444" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-34" y2="34" stroke="#444" stroke-width="8" stroke-linecap="round"/>
      <rect x="20" y="-44" width="30" height="11" rx="4" fill="#222"/>
      <rect x="-50" y="33" width="30" height="11" rx="4" fill="#222"/>
    </g>
    <circle r="8" fill="#333"/>
  </g>

  <!-- ====== 鹈鹕 ====== -->
  <g class="pelican">
    <!-- 远侧腿 -->
    <g class="leg-far">
      <line x1="600" y1="395" x2="612" y2="452" stroke="#e8973f" stroke-width="10" stroke-linecap="round"/>
      <path d="M 606 450 L 634 452 L 606 462 Z" fill="#e8822a"/>
    </g>

    <!-- 尾羽 -->
    <path d="M 560 330 Q 520 318 512 348 Q 546 360 572 350 Z" fill="#f4f1e8"/>

    <!-- 身体 -->
    <ellipse cx="628" cy="330" rx="82" ry="58" fill="#fbf8ef" stroke="#d9d2bd" stroke-width="3"/>
    <path d="M 585 345 Q 628 385 690 350" fill="none" stroke="#d9d2bd" stroke-width="3" opacity="0.7"/>

    <!-- 翅膀 -->
    <path d="M 618 312 Q 560 300 556 342 Q 590 372 648 350 Q 660 322 618 312 Z"
          fill="#f0ead8" stroke="#cfc7ad" stroke-width="3"/>
    <path d="M 575 340 Q 600 356 638 350" fill="none" stroke="#cfc7ad" stroke-width="2.5"/>

    <!-- 脖子（S 形前伸） -->
    <path d="M 668 300 Q 700 280 706 240 Q 710 205 690 190"
          fill="none" stroke="#fbf8ef" stroke-width="30" stroke-linecap="round"/>
    <path d="M 668 300 Q 700 280 706 240 Q 710 205 690 190"
          fill="none" stroke="#e3dcc6" stroke-width="30" stroke-linecap="round" opacity="0.25"/>

    <!-- 头 -->
    <circle cx="686" cy="182" r="26" fill="#fbf8ef" stroke="#d9d2bd" stroke-width="3"/>

    <!-- 眼睛 -->
    <circle cx="694" cy="172" r="6" fill="#222"/>
    <circle cx="696" cy="170" r="2" fill="#fff"/>

    <!-- 大嘴 + 喉囊 -->
    <path d="M 705 178 L 802 196 Q 806 200 800 204 L 712 196 Z" fill="#f2a23c" stroke="#d98a1e" stroke-width="2.5"/>
    <path d="M 710 198 Q 712 232 748 226 Q 782 218 798 202 Q 760 208 710 198 Z"
          fill="#f7b95e" stroke="#d98a1e" stroke-width="2.5"/>
    <line x1="740" y1="194" x2="742" y2="200" stroke="#d98a1e" stroke-width="2"/>

    <!-- 近侧腿 -->
    <g class="leg-near">
      <line x1="600" y1="395" x2="588" y2="452" stroke="#f2a94e" stroke-width="12" stroke-linecap="round"/>
      <path d="M 580 450 L 610 452 L 580 464 Z" fill="#f2992e"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="380" x2="230" y2="380"/>
    <line x1="120" y1="420" x2="220" y2="420"/>
    <line x1="160" y1="460" x2="240" y2="460"/>
  </g>
</svg>
</body>
</html>
